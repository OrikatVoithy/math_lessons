# Builds the lesson pages and publishes them to GitHub Pages.
# Turn on once: repo Settings -> Pages -> Source: "GitHub Actions".
name: Publish lessons to GitHub Pages

on:
  push:
    branches: [main, maidoo/clever-bohr-8mmumh]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build pages
        run: sh trig-lessons/build.sh
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: trig-lessons/dist
      - id: deployment
        uses: actions/deploy-pages@v4
