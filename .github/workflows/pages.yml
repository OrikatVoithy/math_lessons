# Builds the lesson pages and publishes them to GitHub Pages.
# Turn on once: repo Settings -> Pages -> Source: "GitHub Actions".
name: Publish lessons to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Two jobs, as GitHub recommends: the upload must be fully registered before the deploy
  # looks for it. With both in one job, the deploy sometimes ran a second too early and
  # failed with 'No artifacts named "github-pages" were found'.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build pages
        run: sh trig-lessons/build.sh
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: trig-lessons/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
